{% extends "layout.html" %}
{% block body %}
<div class="table-container">
  <table class="custom-table">
    <caption>الاكواد</caption>

    <thead>
      <tr>
        <th>الكود</th>
        <th>الحاله</th>
        <th>مضاف عن طريق</th>
        <th>وقت الاضافه</th>
      </tr>
    </thead>

    <tbody>
      {% for i in data_code %}
        <tr>
          <td>{{ i.code }}</td>
          <td>{{ i.status }}</td>
          <td>{{ i.username }}</td>
          <td>{{ i.created_at }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
