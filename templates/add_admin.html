{% extends "layout.html" %}
{% block body %}
<div class="add_admin_form_1">
  <h2>اضافه ادمن جديد</h2>
        {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-message">
          {{ messages[0] }}
        </div>
      {% endif %}
      
    {% endwith %}
  <form action="/add_admin_new" method="post" class="add_admin_form_2">
    <div class="add_admin_inputs">
        <label class="radio-item">
          <input type="text" name="uesrname"  required placeholder="ادخل الاسم"> 
          <input type="text" name="password"  required placeholder="ادخل الباسور">
        </label>
    </div>
    <button type="submit">تم</button>
  </form>
</div>
{% endblock %}
