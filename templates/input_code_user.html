<!DOCTYPE html>
<html lang="lang="ar dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
      {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-message">
          {{ messages[0] }}
        </div>
      {% endif %}
      
    {% endwith %}
  <div class="login-box">
    <h2>تسجيل الدخول إلى الشبكة</h2>
    <form action="/code_user" method="post">
      <input type="number" name="code" placeholder="اكتب الكود هنا" required>
      <button type="submit">دخول</button>
    </form>
  </div>

</body>
</html>
