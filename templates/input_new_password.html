{% extends "layout.html" %}
{% block body %}
<div class="add_admin_form_1">
  <h2>تغير كلمه السر</h2>

  <form action="/new_password" method="post" class="add_code">
    <div class="add_code">
        <label class="radio-item">
          <input type="text" name="old_password"  required placeholder="كلمه السر الحاليه ">
          <input type="text" name="new_password"  required placeholder="كلمه السر الجديده"> 
          <input type="text" name="confirm_password"  required placeholder="تاكيد كلمه السر الجديده"> 
        </label>
    </div>
    <button type="submit">تم</button>
  </form>
</div>
{% endblock %}
